<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TikTok Authorization Callback</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#0d1322;color:#eef2f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{text-align:center;max-width:700px;padding:50px 40px;border:1px solid #263252;border-radius:16px;background:#111829}
h1{color:#e8730c;font-size:1.6rem}
#code{width:90%;margin:20px auto;padding:16px;background:#05070d;border:1px solid #263252;color:#4ade80;font-family:monospace;font-size:1rem;border-radius:10px;word-break:break-all}
button{background:#e8730c;color:#fff;border:none;padding:12px 30px;border-radius:10px;font-size:1rem;cursor:pointer;margin-top:12px}
p{color:#8494ad}
</style></head>
<body>
<div class="card">
<h1>TikTok authorization received</h1>
<p>Copy the code below and send it to Hermes:</p>
<textarea id="code" rows="4" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').value);this.textContent='Copied ✓'">Copy code</button>
<p id="err" style="color:#ff6b6b"></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const err = params.get('error');
if (code) { document.getElementById('code').value = code; }
else { document.getElementById('err').textContent = 'No code received. Error: ' + (err || 'unknown') + ' — close this and try again.'; }
</script>
</body></html>
